[package]
name = "windows-host"
version = "0.1.0"
edition = "2021"

[dependencies]
connectivity-core = { path = "../../crates/connectivity-core" }
path-probe = { path = "../../crates/path-probe" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
