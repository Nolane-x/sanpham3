name: android-recovery-lab

on:
  push:
    paths:
      - "apps/android-recovery-lab/**"
      - "scripts/virtual-phone-avd-exact-network.sh"
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "crates/peer-session/**"
      - ".github/workflows/android-recovery-lab.yml"
  pull_request:
    paths:
      - "apps/android-recovery-lab/**"
      - "scripts/virtual-phone-avd-exact-network.sh"
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "crates/peer-session/**"
      - ".github/workflows/android-recovery-lab.yml"

jobs:
  build-lab-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] \
             && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -e "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Select Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_PACKAGE="$(sdkmanager --list | sed -n 's/^[[:space:]]*\(ndk;[0-9][^[:space:]]*\).*/\1/p' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build shared Rust peer-session JNI
        run: |
          rm -rf adapters/android-host/src/main/jniLibs
          bash adapters/android-host/build-peer-session-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate exact-Network AVD court script
        run: bash -n scripts/virtual-phone-avd-exact-network.sh

      - name: Unit test and assemble Recovery Lab APK
        run: >
          gradle -p apps/android-recovery-lab
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace

      - name: Verify APK packages both native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/android-recovery-lab/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | tee /tmp/sp3-lab-apk.txt
          grep -q 'lib/arm64-v8a/libsp3_android_peer_session.so' /tmp/sp3-lab-apk.txt
          grep -q 'lib/x86_64/libsp3_android_peer_session.so' /tmp/sp3-lab-apk.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload Recovery Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: sp3-android-recovery-lab
          path: |
            apps/android-recovery-lab/app/build/outputs/apk/debug/*.apk
            apps/android-recovery-lab/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
