name: f5-avd-camera-video-source

on:
  push:
    paths:
      - "apps/android-recovery-lab/**"
      - "apps/signal-trace-replay-cli/**"
      - "crates/signal-frontier/**"
      - "crates/signal-trace-replay/**"
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "scripts/virtual-phone-avd-camera-optical.sh"
      - "docs/F5-AVD-CAMERA-VIDEO-SOURCE.md"
      - ".github/workflows/f5-avd-camera-video-source.yml"
  pull_request:
    paths:
      - "apps/android-recovery-lab/**"
      - "apps/signal-trace-replay-cli/**"
      - "crates/signal-frontier/**"
      - "crates/signal-trace-replay/**"
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "scripts/virtual-phone-avd-camera-optical.sh"
      - "docs/F5-AVD-CAMERA-VIDEO-SOURCE.md"
      - ".github/workflows/f5-avd-camera-video-source.yml"

jobs:
  camera-video-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SP3_EXPECTED_HEX: a53cc35a

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host media/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libpulse0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 emulator stack
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] \
             && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          IMAGE=""
          for candidate in \
            "system-images;android-37.0;google_apis;x86_64" \
            "system-images;android-37.0;google_apis_playstore;x86_64"
          do
            if sdkmanager --list --include_obsolete | grep -Fq "$candidate"; then
              IMAGE="$candidate"
              break
            fi
          done
          test -n "$IMAGE"
          sdkmanager "$IMAGE"
          echo "SP3_ANDROID17_IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_SDK_ROOT/emulator:$PATH"
          EMULATOR_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR_BIN"
          VERSION="$("$EMULATOR_BIN" -version 2>&1 | sed -n 's/^Android emulator version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          test -n "$VERSION"
          python3 - "$VERSION" <<'PY'
          import sys
          parts = [int(x) for x in sys.argv[1].split('.')[:3]]
          parts += [0] * (3 - len(parts))
          if tuple(parts) < (36, 6, 4):
              raise SystemExit(f"Android Emulator 36.6.4+ required, got {sys.argv[1]}")
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Generate deterministic optical camera video
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p signal-trace-replay-cli -- \
            optical-y4m-fixture \
            "$SP3_EXPECTED_HEX" \
            "$RUNNER_TEMP/camera-source.y4m" \
            640 480 120 160 170

          ffmpeg -hide_banner -loglevel warning -y \
            -i "$RUNNER_TEMP/camera-source.y4m" \
            -an \
            -c:v libx264 \
            -preset ultrafast \
            -crf 0 \
            -pix_fmt yuv420p \
            -r 30 \
            "$RUNNER_TEMP/camera-source.mp4"

          test -s "$RUNNER_TEMP/camera-source.mp4"
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$RUNNER_TEMP/camera-source.mp4"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Select Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_PACKAGE="$(
              sdkmanager --list \
                | sed -n 's/^[[:space:]]*\(ndk;[0-9][^[:space:]]*\).*/\1/p' \
                | sort -V \
                | tail -n 1
            )"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build Rust peer-session JNI
        run: bash adapters/android-host/build-peer-session-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit test and assemble Recovery Lab
        run: >-
          gradle -p apps/android-recovery-lab
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace

      - name: Validate camera court orchestrator
        run: bash -n scripts/virtual-phone-avd-camera-optical.sh

      - name: Create Android 17 camera AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd \
            -n sp3-camera \
            -k "$SP3_ANDROID17_IMAGE" \
            --force

      - name: Launch AVD with deterministic video camera
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/camera-evidence"

          emulator @sp3-camera \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back "videofile:$RUNNER_TEMP/camera-source.mp4" \
            -camera-front none \
            >"$RUNNER_TEMP/camera-evidence/emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/camera-evidence/emulator.pid"

          adb -s emulator-5554 wait-for-device
          for _ in $(seq 1 240); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Timed out booting camera AVD" >&2
          exit 1

      - name: Install Recovery Lab
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/android-recovery-lab/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          adb -s emulator-5554 install -r "$APK"

      - name: Run Camera2 optical source court
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/virtual-phone-avd-camera-optical.sh \
            emulator-5554 \
            dev.nolane.sanpham3.recoverylab \
            "$SP3_EXPECTED_HEX" \
            "$RUNNER_TEMP/camera-evidence/court"

      - name: Stop AVD
        if: always()
        run: adb -s emulator-5554 emu kill || true

      - name: Copy source media into evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/camera-evidence/source"
          cp "$RUNNER_TEMP/camera-source.y4m" "$RUNNER_TEMP/camera-evidence/source/" 2>/dev/null || true
          cp "$RUNNER_TEMP/camera-source.mp4" "$RUNNER_TEMP/camera-evidence/source/" 2>/dev/null || true

      - name: Upload camera-source AVD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp3-f5-avd-camera-video-source
          path: ${{ runner.temp }}/camera-evidence
          if-no-files-found: warn
