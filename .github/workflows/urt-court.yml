name: urt-court

on:
  push:
    paths:
      - "crates/urt-core/**"
      - "apps/urt-lab-cli/**"
      - "Cargo.toml"
      - ".github/workflows/urt-court.yml"
  pull_request:
    paths:
      - "crates/urt-core/**"
      - "apps/urt-lab-cli/**"
      - "Cargo.toml"
      - ".github/workflows/urt-court.yml"

jobs:
  exact-reconstruction:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p urt-core -p urt-lab-cli --all-targets -- -D warnings
      - run: cargo test -p urt-core
      - run: cargo run -p urt-lab-cli
