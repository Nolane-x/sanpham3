name: android-ci

on:
  push:
    paths:
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "crates/peer-session/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "adapters/android-host/**"
      - "adapters/android-peer-session-jni/**"
      - "crates/peer-session/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] \
             && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -e "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Select Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR=""
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_PACKAGE="$(sdkmanager --list | sed -n 's/^[[:space:]]*\(ndk;[0-9][^[:space:]]*\).*/\1/p' | sort -V | tail -n 1)"
            test -n "$NDK_PACKAGE"
            sdkmanager "$NDK_PACKAGE"
            NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build Rust peer-session JNI libraries
        run: |
          rm -rf adapters/android-host/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o adapters/android-host/src/main/jniLibs build -p android-peer-session-jni --release
          test -f adapters/android-host/src/main/jniLibs/arm64-v8a/libsp3_android_peer_session.so
          test -f adapters/android-host/src/main/jniLibs/x86_64/libsp3_android_peer_session.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and test Android host adapter
        run: gradle -p adapters/android-host testDebugUnitTest assembleDebug --stacktrace

      - name: Verify AAR packages both JNI ABIs
        shell: bash
        run: |
          set -euo pipefail
          AAR="$(find adapters/android-host/build/outputs/aar -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          unzip -l "$AAR" | tee /tmp/sp3-aar.txt
          grep -q 'jni/arm64-v8a/libsp3_android_peer_session.so' /tmp/sp3-aar.txt
          grep -q 'jni/x86_64/libsp3_android_peer_session.so' /tmp/sp3-aar.txt
