name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python scripts/summarize-physical-evidence.py --self-test
      - run: python scripts/physical-gate-readiness.py --self-test
      - run: bash -n scripts/android-physical-campaign.sh
      - run: bash scripts/android-physical-campaign.sh --self-test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/android-physical-campaign.ps1 --self-test
